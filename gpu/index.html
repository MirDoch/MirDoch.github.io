<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVIDIA 显卡算力与参数对比</title>
<style>
:root{
  --bg:#0b0d10; --bg2:#111418; --bg3:#161b21; --line:#232b33; --line2:#2f3a45;
  --fg:#eef3f8; --dim:#96a3b1; --dim2:#6c7a89;
  --accent:#76b900; --accent-soft:rgba(118,185,0,.16); --accent-line:rgba(118,185,0,.45);
  --best:#5fd700; --warn:#ffb020; --blue:#57a8ff; --purple:#b07dff;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
  /* 需要在主题间切换的颜色 */
  --header-bg:rgba(11,13,16,.92);
  --row-head:#141a20;          /* 表头 */
  --col-head:#12161b;          /* 左侧固定列 */
  --thead-fg:#eef3f8;
  --group-bg:#0f1317;          /* 分组行 */
  --hover:#151b21;
  --hover-param:#171e25;
  --card-hover:#171d24;
  --btn-hover:#1b2229;
  --seg-on:#cff39a;
  --chip-on:#cff39a;
  --track:#0e1216;             /* 图表轨道 */
  --track-line:#232b33;
  --box-border:#4a5764;        /* 复选框 */
  --grid-line:#1e252c;         /* 速览分隔虚线 */
  --scroll:#2a333d;
  --on-accent:#0d1105;         /* 强调色上的文字 */
  --bar-from:#4d7d00; --bar-to:#8ede1a;
  --bar-dc-from:#1c5fa8; --bar-dc-to:#4fa3ff;
  --bar-ws-from:#6a3fb5; --bar-ws-to:#b07dff;
  --shadow:rgba(0,0,0,.5);
}
html[data-theme="light"]{
  --bg:#f4f6f8; --bg2:#ffffff; --bg3:#eef1f4; --line:#dde3e9; --line2:#c7d0d9;
  --fg:#131a20; --dim:#5d6b78; --dim2:#8593a0;
  --accent:#5d9200; --accent-soft:rgba(118,185,0,.14); --accent-line:rgba(93,146,0,.5);
  --best:#2f7d00; --warn:#b26a00; --blue:#1668c9; --purple:#6d3fd0;
  --header-bg:rgba(255,255,255,.94);
  --row-head:#e9eef2;
  --col-head:#f2f5f8;
  --thead-fg:#131a20;
  --group-bg:#eef2f6;
  --hover:#e8eff6;
  --hover-param:#e2ebf4;
  --card-hover:#e9eef3;
  --btn-hover:#e3e9ef;
  --seg-on:#33530a;
  --chip-on:#33530a;
  --track:#e6ebf0;
  --track-line:#cfd8e0;
  --box-border:#9aa8b4;
  --grid-line:#dfe5ea;
  --scroll:#c3ccd5;
  --on-accent:#ffffff;
  --bar-from:#6aa300; --bar-to:#a6e02a;
  --bar-dc-from:#2f7fd4; --bar-dc-to:#8cc4ff;
  --bar-ws-from:#8a5fd0; --bar-ws-to:#c3a3ff;
  --shadow:rgba(20,30,40,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono);font-size:12.5px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:var(--header-bg);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 16px}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.2px}
.eye{width:11px;height:11px;border-radius:3px;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-soft)}
.meta{color:var(--dim);font-size:12.5px}
.spacer{flex:1 1 auto}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);
  border:1px solid var(--line2);border-radius:999px;padding:2px 9px;background:var(--bg3)}
.badge b{color:var(--fg);font-weight:600}

/* ---------- layout ---------- */
.wrap{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 55px)}
aside{width:330px;flex:0 0 330px;border-right:1px solid var(--line);
  position:sticky;top:55px;height:calc(100vh - 55px);display:flex;flex-direction:column;background:var(--bg2)}
.aside-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--line2);
  border-radius:8px;padding:7px 10px}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--fg);font-size:13.5px}
.search svg{flex:0 0 auto;opacity:.6}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--bg3);color:var(--dim);border-radius:999px;
  padding:3px 10px;font-size:12px;cursor:pointer;user-select:none}
.chip:hover{color:var(--fg);border-color:var(--accent-line)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--chip-on)}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line2);background:var(--bg3);color:var(--fg);border-radius:7px;
  padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--btn-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.count-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.count-row input[type=range]{flex:1;accent-color:var(--accent)}
.count-row .num{font-family:var(--mono);color:var(--fg);min-width:2.6em;text-align:right}
.gpu-list{overflow:auto;padding:8px 8px 40px;flex:1 1 auto}
.gpu-list::-webkit-scrollbar,.tablewrap::-webkit-scrollbar{width:10px;height:10px}
.gpu-list::-webkit-scrollbar-thumb,.tablewrap::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:6px}
.gpu-list::-webkit-scrollbar-track,.tablewrap::-webkit-scrollbar-track{background:transparent}
.group-title{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:.6px;
  text-transform:uppercase;color:var(--dim2);margin:12px 6px 6px;cursor:pointer;user-select:none}
.group-title .tri{transition:transform .15s;font-size:9px;display:inline-block}
.group-title.closed .tri{transform:rotate(-90deg)}
.group-title:hover{color:var(--fg)}
.group-title .cnt{margin-left:auto;font-size:11px;color:var(--dim2);letter-spacing:0;text-transform:none}
.group-title.level1{font-size:12px;color:var(--fg);margin:14px 6px 4px;letter-spacing:.4px}
.group-title.level1 .lbl{font-weight:650}
.group-title.level2{margin:6px 6px 4px 12px;padding-left:8px;border-left:2px solid var(--line2)}
.group-title.level2 .lbl{color:var(--dim);letter-spacing:.2px;text-transform:none;font-size:12px}
.group-body{padding-left:4px}
.list-hint{font-size:11.5px;color:var(--dim2);padding:12px 10px 24px;line-height:1.5;border-top:1px solid var(--line);margin-top:12px}
.gpu-card{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;margin-bottom:3px}
.gpu-card:hover{background:var(--card-hover)}
.gpu-card.on{background:var(--accent-soft);border-color:var(--accent-line)}
.gpu-card .box{flex:0 0 auto;width:15px;height:15px;border-radius:4px;border:1.5px solid var(--box-border);margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--on-accent)}
.gpu-card.on .box{background:var(--accent);border-color:var(--accent)}
.gpu-card .info{min-width:0;flex:1}
.gpu-card .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpu-card .s{font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpu-card .tag{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;margin-left:6px;
  border:1px solid var(--line2);color:var(--dim);vertical-align:1px}
.empty{padding:26px 16px;color:var(--dim2);text-align:center;font-size:12.5px}

/* ---------- main ---------- */
main{flex:1 1 auto;min-width:0;padding:14px 16px 60px;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 13px;
  border-bottom:1px solid var(--line);background:var(--col-head)}
.panel-head h2{margin:0;font-size:14px;font-weight:650;letter-spacing:.2px}
.panel-head .sub{font-size:12px;color:var(--dim)}
.panel-body{padding:12px 13px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:var(--bg3);color:var(--dim);border:0;padding:4px 11px;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent-soft);color:var(--seg-on)}
select{background:var(--bg3);color:var(--fg);border:1px solid var(--line2);border-radius:7px;
  padding:5px 8px;font-size:13px;outline:0;max-width:100%}
.hint{font-size:12px;color:var(--dim);margin:0 0 10px}

/* ---------- compare table ---------- */
.tablewrap{overflow:auto;max-height:none}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.cmp th,table.cmp td{padding:7px 10px;text-align:right;white-space:nowrap;vertical-align:middle}
table.cmp thead th{position:sticky;top:0;z-index:5;background:var(--row-head);border-bottom:1px solid var(--line2);
  font-weight:600;text-align:right;color:var(--thead-fg)}
table.cmp thead th.param{left:0;z-index:8;text-align:left;min-width:168px;border-right:1px solid var(--line2)}
table.cmp td.param,table.cmp th.param{position:sticky;left:0;z-index:4;background:var(--col-head);text-align:left;
  border-right:1px solid var(--line2);color:var(--fg);font-weight:500}
table.cmp tbody tr:hover td{background:var(--hover)}
table.cmp tbody tr:hover td.param{background:var(--hover-param)}
table.cmp tr.group th{background:var(--group-bg);color:var(--dim);font-size:11.5px;letter-spacing:.8px;
  text-transform:uppercase;text-align:left;position:sticky;left:0;z-index:3;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:6px 10px}
table.cmp td.best{color:var(--best);font-weight:700}
table.cmp td.best::after{content:" ★";font-size:10px;color:var(--best)}
table.cmp td.na{color:var(--dim2)}
table.cmp .colhead{text-align:right}
.colhead .nm{display:block;font-size:13px;font-weight:650}
.colhead .arch{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:1px}
.colhead .x{display:inline-block;margin-left:6px;color:var(--dim2);cursor:pointer;font-size:12px}
.colhead .x:hover{color:#e05252}
.precision{cursor:pointer;border-bottom:1px dotted var(--dim2)}
.precision.on{color:var(--accent);border-bottom-color:var(--accent)}
.precision:hover{color:var(--accent)}
sup.est{color:var(--warn);font-size:10px;margin-left:1px;cursor:help}

/* relative row */
td.rel{font-family:var(--mono);font-size:12.5px}
td.rel .bar{display:block;height:4px;border-radius:2px;background:var(--accent);opacity:.75;margin-top:4px}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:190px 1fr 96px;gap:10px;align-items:center}
.bar-row .nm{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .nm i{color:var(--dim2);font-style:normal;font-size:11px}
.bar-track{height:20px;background:var(--track);border:1px solid var(--track-line);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--bar-from),var(--bar-to));border-radius:5px 0 0 5px;
  transition:width .25s}
.bar-fill.dc{background:linear-gradient(90deg,var(--bar-dc-from),var(--bar-dc-to))}
.bar-fill.ws{background:linear-gradient(90deg,var(--bar-ws-from),var(--bar-ws-to))}
.bar-val{font-family:var(--mono);font-size:12.5px;text-align:right;color:var(--fg)}
.bar-val em{font-style:normal;color:var(--dim);font-size:11px;display:block}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--dim2);margin-left:200px;
  border-top:1px dashed var(--line2);padding-top:3px}

/* ---------- mini compare ---------- */
.mini{display:grid;gap:10px}
.mini-card{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.mini-card h3{margin:0 0 2px;font-size:13.5px}
.mini-card .arch{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--grid-line);padding-bottom:4px}
.kv span{color:var(--dim);font-size:12px}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.kv b.win{color:var(--best)}
.winner-tag{font-size:11px;color:var(--dim2);margin-top:8px}

/* ---------- sources ---------- */
.src-list{margin:0;padding-left:18px;font-size:12.5px;color:var(--dim)}
.src-list li{margin:3px 0}
details.note{font-size:12.5px;color:var(--dim)}
details.note summary{cursor:pointer;color:var(--fg);font-size:13px;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
.legend i{display:inline-block;width:22px;height:8px;border-radius:2px;vertical-align:1px;margin-right:5px}
.legend i.geforce{background:linear-gradient(90deg,var(--bar-from),var(--bar-to))}
.legend i.ws{background:linear-gradient(90deg,var(--bar-ws-from),var(--bar-ws-to))}
.legend i.dc{background:linear-gradient(90deg,var(--bar-dc-from),var(--bar-dc-to))}
footer{color:var(--dim2);font-size:12px;padding:0 2px 30px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--bg3);border:1px solid var(--line2);color:var(--fg);border-radius:9px;padding:9px 16px;
  font-size:13px;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;box-shadow:0 8px 30px var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:1080px){
  .wrap{flex-direction:column}
  aside{position:relative;top:0;width:100%;flex:0 0 auto;height:auto;max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:12px 12px 50px}
  .bar-row{grid-template-columns:120px 1fr 88px}
  .axis{margin-left:130px}
}
@media print{
  aside,.panel-head .tools,.seg,header .tools{display:none}
  body{background:#fff;color:#000}
  .panel{border-color:#bbb}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><span class="eye"></span>NVIDIA 显卡算力与参数对比</div>
    <span class="badge">数据快照 <b id="snap"></b></span>
    <span class="badge">型号 <b id="total"></b></span>
    <span class="badge">已选 <b id="selcount">0</b></span>
    <span class="badge" id="theme-badge">主题 <b id="theme-name">深色</b></span>
    <span class="spacer"></span>
    <div class="tools">
      <button class="btn" id="btn-theme" title="切换白天 / 夜间模式">☀ 白天模式</button>
      <button class="btn" id="btn-export">导出 CSV</button>
      <button class="btn" id="btn-print">打印 / PDF</button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="aside-head">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
        <input id="q" type="search" placeholder="搜索型号：5090 / 3080 / H200 / RTX PRO" autocomplete="off">
      </div>
      <div class="filters" id="cats"></div>
      <div class="count-row">
        <span>对比数量下限</span>
        <input id="mincount" type="range" min="1" max="12" value="2" step="1">
        <span class="num" id="mincount-v">2</span>
      </div>
      <div class="tools">
        <button class="btn" data-preset="top">旗舰芯片</button>
        <button class="btn" data-preset="ai">AI 推理</button>
        <button class="btn" data-preset="dc">数据中心</button>
        <button class="btn" data-preset="ge30">RTX 30 系</button>
        <button class="btn" data-preset="clear">清空</button>
      </div>
    </div>
    <div class="gpu-list" id="list"></div>
  </aside>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>参数对比矩阵</h2>
        <span class="sub" id="matrix-sub"></span>
        <span class="spacer"></span>
        <span class="sub" style="color:var(--warn)">†</span><span class="sub">= 按官方吞吐量换算的推算值</span>
        <div class="seg" id="rel-toggle">
          <button data-rel="max" class="on">相对最高</button>
          <button data-rel="min">相对最低</button>
        </div>
      </div>
      <div class="tablewrap" id="matrix"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>算力对比图表</h2>
        <select id="precision"></select>
        <div class="seg" id="density">
          <button data-d="sparse">含稀疏</button>
          <button data-d="dense" class="on">稠密</button>
        </div>
        <span class="spacer"></span>
        <span class="sub" id="chart-sub"></span>
      </div>
      <div class="panel-body">
        <p class="hint" id="chart-hint"></p>
        <div class="bars" id="bars"></div>
        <div class="axis"><span>0</span><span id="axis-mid"></span><span id="axis-max"></span></div>
        <div class="legend">
          <span><i class="lg geforce"></i>消费级 GeForce</span>
          <span><i class="lg ws"></i>工作站 RTX PRO / RTX</span>
          <span><i class="lg dc"></i>数据中心 H / B / A / L 系列</span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>主要指标速览</h2><span class="sub">点击左侧卡片可增删，最多 4 张</span></div>
      <div class="panel-body"><div class="mini" id="mini"></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>数据来源与口径</h2></div>
      <div class="panel-body">
        <details class="note" open>
          <summary>官方来源清单（快照时抓取的页面）</summary>
          <ul class="src-list" id="srclist"></ul>
        </details>
        <details class="note">
          <summary>口径说明：稠密 / 稀疏、TFLOPS / TOPS、衍生值</summary>
          <div id="caliber" style="margin-top:8px"></div>
        </details>
      </div>
    </section>

    <footer id="foot"></footer>
  </main>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   NVIDIA 显卡算力与参数对比 —— 单文件应用
   数据由 tools/build.js 内嵌（见 const EMBEDDED），

const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
function dig(obj, path){ return String(path).split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function num(v){ return typeof v === 'number' && isFinite(v) ? v : null; }
function fmt(v, digits){
  const n = num(v);
  if (n === null) return null;
  const d = digits == null ? (Math.abs(n) >= 100 ? 0 : (Math.abs(n) >= 10 ? 1 : (Math.abs(n) >= 1 ? 2 : 3))) : digits;
  return n.toFixed(d).replace(/\.?0+$/, m => (m.indexOf('.') === 0 ? '' : m));
}
function shortScale(n, digits){
  const d = digits == null ? 1 : digits;
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(Math.abs(n) >= 10000 ? 1 : 2).replace(/\.?0+$/,'') + 'e3';
  return n.toFixed(Math.abs(n) < 10 ? 2 : (Math.abs(n) < 100 ? 1 : 0)).replace(/\.?0+$/,'');
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- 主题（白天 / 夜间） ---------- */
function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('gpucompare-theme'); } catch (e) {}
  applyTheme(saved || 'dark');
  const b = $('#btn-theme');
  if (b) b.onclick = ()=> applyTheme(currentTheme() === 'light' ? 'dark' : 'light');
}
function currentTheme(){ return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark'; }
function applyTheme(theme){
  const t = theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  const b = $('#btn-theme'), n = $('#theme-name');
  if (b) b.textContent = t === 'light' ? '🌙 夜间模式' : '☀ 白天模式';
  if (b) b.title = t === 'light' ? '切换到夜间模式' : '切换到白天模式';
  if (n) n.textContent = t === 'light' ? '白天' : '深色';
  try { localStorage.setItem('gpucompare-theme', t); } catch (e) {}
}

/* ============================================================
   数据装载
   ============================================================ */
async function loadData(){
  if (EMBEDDED) return EMBEDDED;
  try {
    const r = await fetch('data/gpu-data.json', { cache:'no-store' });
    if (r.ok) return await r.json();
  } catch (e) { /* file:// 下会失败，属预期 */ }
  throw new Error('未找到内嵌数据，且无法读取 data/gpu-data.json');
}

/* ============================================================
   初始化
   ============================================================ */
(async function main(){
  try { state.data = await loadData(); }
  catch (e) { $('#list').innerHTML = '<div class="empty">数据加载失败：' + e.message + '</div>'; return; }

  const models = state.data.models.slice().sort((a,b)=> (a.order??999)-(b.order??999));
  state.data.models = models;

  initTheme();
  $('#snap').textContent = state.data.generated || '—';
  $('#total').textContent = models.length + ' 款';
  $('#selcount').textContent = '0';
  $('#foot').textContent = (state.data.disclaimer || '');

  buildCatChips();
  collapseAll();
  renderList();
  bindUI();
  render();   // 默认不选中任何显卡，页面为空白状态
})();

function buildCatChips(){
  const box = $('#cats');
  box.innerHTML = '';
  Object.keys(CAT_LABEL).forEach(k=>{
    const n = state.data.models.filter(m=>m.category===k).length;
    const c = el('div','chip on', CAT_LABEL[k].replace(/^.*?(GeForce|RTX|H|B)/,'$1') + ' ' + n);
    c.title = CAT_LABEL[k] + '：' + n + ' 款';
    c.dataset.cat = k;
    c.onclick = ()=>{ state.cats.has(k) ? state.cats.delete(k) : state.cats.add(k);
      c.classList.toggle('on'); renderList(); render(); };
    state.cats.add(k);
    box.appendChild(c);
  });
}

function bindUI(){
  $('#q').addEventListener('input', e=>{ state.q = e.target.value.trim().toLowerCase(); renderList(); });  $('#mincount').addEventListener('input', e=>{
    state.minCount = +e.target.value; $('#mincount-v').textContent = state.minCount;
  });
  document.querySelectorAll('[data-preset]').forEach(b=> b.onclick = ()=> applyPreset(b.dataset.preset));
  $('#btn-export').onclick = exportCSV;
  $('#btn-print').onclick = ()=> window.print();
  document.querySelectorAll('#rel-toggle button').forEach(b=> b.onclick = ()=>{
    state.rel = b.dataset.rel;
    document.querySelectorAll('#rel-toggle button').forEach(x=> x.classList.toggle('on', x===b));
    render();
  });
  document.querySelectorAll('#density button').forEach(b=> b.onclick = ()=>{
    state.density = b.dataset.d;
    document.querySelectorAll('#density button').forEach(x=> x.classList.toggle('on', x===b));
    renderChart(); renderMatrix();
  });
  const sel = $('#precision');
  sel.onchange = ()=>{ state.precision = sel.value; renderChart(); renderMatrix(); renderMini(); };
}

function applyPreset(name){
  const byTag = t => state.data.models.filter(m=> (m.tags||[]).includes(t));
  let picks = [];
  if (name === 'top')   picks = state.data.models.filter(m=> m.flagship).slice(0,8);
  if (name === 'ai')    picks = byTag('ai');
  if (name === 'dc')    picks = state.data.models.filter(m=> m.category==='datacenter');
  if (name === 'ge30')  picks = state.data.models.filter(m=> /30 系列/.test(m.series || ''));
  if (name === 'clear') picks = [];
  if (!picks.length && name !== 'clear'){ render(); return; }
  state.selected = picks.map(m=>m.id);
  /* 选中后展开对应分组，避免"选中了却看不到"；清空时恢复默认的全部收起 */
  if (name === 'clear') collapseAll(); else expandAll();
  renderList(); render();
  toast(name === 'clear' ? '已清空选择，左侧分类恢复默认收起' : '已选择 ' + state.selected.length + ' 款');
}

/* ============================================================
   左侧列表
   ============================================================ */
function visibleModels(){
  const q = state.q;
  return state.data.models.filter(m=>{
    if (!state.cats.has(m.category)) return false;
    if (!q) return true;
    const hay = [m.name, m.short_name, m.codename, m.architecture, m.series, (m.aliases||[]).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  });
}

function buildSeriesMap(){
  const map = new Map();
  state.data.models.forEach(m=>{
    if (!map.has(m.category)) map.set(m.category, new Map());
    const bySeries = map.get(m.category);
    const key = m.series || m.architecture || '其他';
    if (!bySeries.has(key)) bySeries.set(key, []);
    bySeries.get(key).push(m);
  });
  return map;
}

/** 默认状态：一级与二级分类全部收起 */
function collapseAll(){
  state.collapsedCats = new Set(Object.keys(CAT_LABEL));
  state.collapsedSeries = new Set();
  state.data.models.forEach(m=>{
    state.collapsedSeries.add(m.category + '::' + (m.series || m.architecture || '其他'));
  });
}
/** 展开所有分组（预设选中后调用，避免"选中了却看不到"） */
function expandAll(){
  state.collapsedCats.clear();
  state.collapsedSeries.clear();
}

function renderList(){
  const box = $('#list'); box.innerHTML = '';
  const all = visibleModels();
  if (!all.length){ box.appendChild(el('div','empty','没有匹配的型号，换个关键词试试')); return; }

  /* 搜索时自动展开所有分组，方便直接看到命中的型号 */
  const forceOpen = !!state.q;
  const seriesMap = buildSeriesMap();
  let totalShown = 0, totalAll = 0;

  Object.keys(CAT_LABEL).forEach(cat=>{
    const scoped = all.filter(m=> m.category === cat);
    const allInCat = state.data.models.filter(m=> m.category === cat);
    if (!state.cats.has(cat)) return;
    totalShown += scoped.length; totalAll += allInCat.length;

    const seriesList = seriesMap.get(cat) || new Map();
    const catCollapsed = !forceOpen && state.collapsedCats.has(cat);

    /* 一级：显卡类别 */
    const chead = el('div','group-title level1' + (catCollapsed ? ' closed' : ''));
    chead.appendChild(el('span','tri','▼'));
    const cl = el('span','lbl', CAT_LABEL[cat]);
    chead.appendChild(cl);
    chead.appendChild(el('span','cnt', scoped.length + (scoped.length !== allInCat.length ? '/' + allInCat.length : '') + ' 款'));
    chead.title = catCollapsed ? '展开' : '收起';
    chead.onclick = ()=>{
      if (state.collapsedCats.has(cat)) state.collapsedCats.delete(cat); else state.collapsedCats.add(cat);
      state.searching = false; renderList();
    };
    box.appendChild(chead);

    const cwrap = el('div','group-body');
    if (catCollapsed) cwrap.style.display = 'none';
    box.appendChild(cwrap);

    seriesList.forEach((items, series)=>{
      const inScope = items.filter(m=> scoped.includes(m));
      if (!inScope.length) return;
      const key = cat + '::' + series;
      const sCollapsed = !forceOpen && state.collapsedSeries.has(key);

      /* 二级：代次 / 产品线 */
      const shead = el('div','group-title level2' + (sCollapsed ? ' closed' : ''));
      shead.appendChild(el('span','tri','▼'));
      shead.appendChild(el('span','lbl', series));
      shead.appendChild(el('span','cnt', inScope.length + ' 款'));
      shead.onclick = ()=>{
        if (state.collapsedSeries.has(key)) state.collapsedSeries.delete(key); else state.collapsedSeries.add(key);
        state.searching = false; renderList();
      };
      cwrap.appendChild(shead);

      const swrap = el('div','group-body');
      if (sCollapsed) swrap.style.display = 'none';
      cwrap.appendChild(swrap);

      inScope.forEach(m=> swrap.appendChild(gpuCard(m)));
    });
  });

  if (!totalShown){
    box.appendChild(el('div','empty','当前分类被过滤掉了，请在上方重新勾选分类'));
    return;
  }
  const hint = el('div','list-hint', '默认收起全部分组，点标题展开；共 ' + totalAll + ' 款，当前显示 ' + totalShown + ' 款');
  box.appendChild(hint);
}

function gpuCard(m){
  const on = state.selected.includes(m.id);
  const c = el('div','gpu-card' + (on?' on':''));
  c.dataset.id = m.id;
  c.appendChild(el('div','box', on?'✓':''));
  const info = el('div','info');
  const n = el('div','n');
  n.appendChild(document.createTextNode(m.name));
  if (m.tag) n.appendChild(el('span','tag', m.tag));
  info.appendChild(n);
  info.appendChild(el('div','s', [ (m.memory_size_gb?m.memory_size_gb+'GB':'') , m.memory_type||'', m.architecture||'' ].filter(Boolean).join(' · ')));
  c.appendChild(info);
  c.onclick = ()=> toggleModel(m.id);
  return c;
}

/* 供测试与非标准环境使用的最简 closest 替代 */
function closestWithClass(node, cls){
  while (node){
    if (node.classList && node.classList.contains(cls)) return node;
    node = node.parentNode;
  }
  return null;
}

function toggleModel(id){
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i,1);
  else state.selected.push(id);
  renderList(); render();
}

/* ============================================================
   渲染总控
   ============================================================ */
function selectedModels(){
  const map = new Map(state.data.models.map(m=>[m.id,m]));
  return state.selected.map(id=>map.get(id)).filter(Boolean);
}

function effectivePrecision(){
  const p = state.precision || 'tensor_sparse_tflops.fp8';
  const key = state.density === 'dense' ? (PRECISIONS.find(x=>x.key===p)?.dense || p) : p;
  return key;
}
function precisionMeta(){
  const used = state.precision || 'tensor_sparse_tflops.fp8';
  return PRECISIONS.find(x=> x.key === used || x.dense === used) || PRECISIONS[1];
}
function valueFor(m, key){
  if (key === 'fp16_dense_vector'){
    const f = num(m.fp32_tflops_dense);
    return f == null ? null : f * 2;
  }
  return num(dig(m, key));
}

function render(){
  renderMatrix(); renderPrecisionSelect(); renderChart(); renderMini(); renderSources();
  $('#selcount').textContent = state.selected.length;
}

function renderPrecisionSelect(){
  const sel = $('#precision');
  const want = state.precision || 'tensor_sparse_tflops.fp8';
  sel.innerHTML = '';
  PRECISIONS.forEach(p=>{
    const o = el('option', null, p.label + '（' + p.unit + '）');
    o.value = p.key;
    if (p.key === want) o.selected = true;
    sel.appendChild(o);
  });
}

/* ============================================================
   参数对比矩阵
   ============================================================ */
function cellValue(m, prm){
  const path = prm.p.indexOf('prec.') === 0 ? effectivePrecision() : prm.p;
  const raw = path === 'fp16_dense_vector' ? valueFor(m, path) : dig(m, path);
  return { path, raw };
}

function renderMatrix(){
  const box = $('#matrix'); box.innerHTML = '';
  const ms = selectedModels();
  $('#matrix-sub').textContent = ms.length ? ('已选 ' + ms.length + ' 款 · 点击单元格查看来源' + (ms.length > 6 ? ' · 可左右滚动' : '')) : '';
  if (!ms.length){
    box.appendChild(el('div','empty','尚未选择显卡。请在左侧展开「消费级 GeForce / 工作站 / 数据中心」并勾选型号，或用上方的快捷按钮。'));
    return;
  }
  const table = el('table','cmp');

  /* 表头 */
  const thead = el('thead'); const hr = el('tr');
  const thp = el('th','param','参数'); thp.scope = 'col'; hr.appendChild(thp);
  ms.forEach(m=>{
    const th = el('th','colhead');
    const nm = el('span','nm'); nm.appendChild(document.createTextNode(m.name)); th.appendChild(nm);
    th.appendChild(el('span','arch', (m.architecture||'') + (m.codename?(' · '+m.codename):'')));
    const x = el('span','x','✕'); x.title = '移除该列';
    x.onclick = ()=> toggleModel(m.id);
    th.appendChild(x);
    hr.appendChild(th);
  });
  thead.appendChild(hr); table.appendChild(thead);

  /* 表体 */
  const tb = el('tbody');
  GROUPS.forEach(g=>{
    const rows = PARAMS.filter(p=>p.group===g && rowApplicable(p, ms));
    if (!rows.length) return;
    const gr = el('tr','group'); const gth = el('th'); gth.colSpan = ms.length + 1;
    gth.textContent = g; gr.appendChild(gth); tb.appendChild(gr);

    rows.forEach(prm=>{
      const tr = el('tr');
      const td0 = el('td','param');
      const path = prm.p.indexOf('prec.') === 0 ? null : prm.p;
      const isPrecisionRow = ['tensor_dense_tflops.fp4','tensor_dense_tflops.fp8','tensor_dense_tflops.fp16','tensor_dense_tflops.bf16','tensor_dense_tflops.tf32','tensor_dense_tflops.int8','tensor_dense_tflops.fp6'].includes(prm.p);
      if (isPrecisionRow){
        const sp = el('span','precision' + (state.precision === prm.p ? ' on' : ''), prm.label);
        sp.title = '设为图表与效率指标的默认精度';
        sp.onclick = ()=>{ state.precision = prm.p; if (state.density==='sparse') state.density='dense';
          document.querySelectorAll('#density button').forEach(x=> x.classList.toggle('on', x.dataset.d===state.density));
          $('#precision').value = prm.p; render(); };
        td0.appendChild(sp);
      } else {
        td0.textContent = prm.label;
      }
      if (prm.unit) td0.appendChild(el('span','unit', ' ('+prm.unit+')'));
      tr.appendChild(td0);

      const cells = ms.map(m=>{
        const { raw } = cellValue(m, prm);
        return { m, v: num(raw), raw };
      });
      const nums = cells.filter(c=>c.v !== null);
      let bestVal = null;
      if (nums.length > 1 && prm.mode !== 'plain'){
        const vals = nums.map(c=>c.v);
        bestVal = prm.mode === 'max' ? Math.max(...vals) : Math.min(...vals);
      }
      cells.forEach(c=>{
        const td = el('td');
        const derived = isDerived(c.m, prm.p);
        if (c.v === null){
          td.textContent = c.raw == null ? '—' : String(c.raw);
          td.className = 'na';
        } else if (typeof c.raw === 'number'){
          td.textContent = fmt(c.raw, prm.digits);
          if (bestVal !== null && c.v === bestVal) td.className = 'best';
        } else {
          td.textContent = String(c.raw);
          td.style.whiteSpace = 'normal';
        }
        if (derived && c.v !== null){
          const sup = el('sup','est','†');
          sup.title = '该数值由 NVIDIA 公布的每 SM 每时钟吞吐量 / 官方 AI TOPS 换算得出（非官方直接标注）';
          td.appendChild(sup);
        }
        if (prm.src && c.v !== null) td.title = sourceTip(c.m, prm.src) + (derived ? '\n（推算值：†）' : '');
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  });

  /* 相对值行 */
  const relRows = [
    { key:'fp32_tflops_dense', label:'FP32 相对值', unit:'TFLOPS', mode:'max' },
    { key: effectivePrecision(), label:'算力相对值（当前精度）', unit: precisionMeta().unit, mode:'max' },
    { key:'memory_bandwidth_gbs', label:'显存带宽相对值', unit:'GB/s', mode:'max' },
    { key:'max_power_w', label:'功耗相对值', unit:'W', mode:'min' }
  ].filter(r=> r.key && ms.some(m=> valueFor(m, r.key) !== null));

  if (relRows.length){
    const gr = el('tr','group'); const gth = el('th'); gth.colSpan = ms.length + 1;
    gth.textContent = '相对比较（' + (state.rel === 'max' ? '以最高值为 100%' : '以最低值为 100%') + '）';
    gr.appendChild(gth); tb.appendChild(gr);
    relRows.forEach(r=>{
      const tr = el('tr');
      const td0 = el('td','param', r.label); td0.appendChild(el('span','unit',' ('+r.unit+')')); tr.appendChild(td0);
      const vals = ms.map(m=> valueFor(m, r.key));
      const present = vals.filter(v=>v!==null);
      if (!present.length){ ms.forEach(()=> tr.appendChild(el('td','na','—'))); tb.appendChild(tr); return; }
      const ref = state.rel === 'max' ? Math.max(...present) : Math.min(...present);
      vals.forEach(v=>{
        const td = el('td','rel');
        if (v === null){ td.textContent = '—'; td.className = 'na'; tr.appendChild(td); return; }
        const pct = ref ? (v / ref) * 100 : 0;
        td.textContent = (pct >= 10 ? pct.toFixed(pct>=100?0:1) : pct.toFixed(2)) + '%';
        const bar = el('span','bar');
        const w = state.rel === 'max' ? Math.min(100, pct) : Math.min(100, 100 * ref / v);
        bar.style.width = Math.max(2, w) + '%';
        bar.style.display = 'block';
        bar.style.background = r.key === 'max_power_w' ? '#ffb020' : '';
        td.appendChild(bar);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }
  table.appendChild(tb);
  box.appendChild(table);
}

function rowApplicable(prm, ms){
  const any = ms.some(m=>{
    const path = prm.p.indexOf('prec.') === 0 ? effectivePrecision() : prm.p;
    if (path === 'fp16_dense_vector') return valueFor(m, path) !== null;
    return dig(m, path) !== null && dig(m, path) !== undefined;
  });
  return any;
}

function sourceTip(m, kind){
  const s = (m.sources || []).find(x=> x.kind === kind) || (m.sources || [])[0];
  return s ? (kind + '：' + (s.note || '') + '\n' + s.url) : '';
}
function isDerived(m, path){
  const p = path.indexOf('prec.') === 0 ? effectivePrecision() : path;
  const list = m.derived || [];
  return list.some(d=> p === d || p.indexOf(d + '.') === 0);
}

/* ============================================================
   算力图表
   ============================================================ */
function renderChart(){
  const box = $('#bars'); box.innerHTML = '';
  const ms = selectedModels();
  const key = effectivePrecision();
  const meta = precisionMeta();
  const densityLabel = state.density === 'dense' ? '稠密（dense）' : '含 2:4 稀疏（sparse）';
  const unit = meta.unit;
  if (!ms.length){ box.appendChild(el('div','empty','尚未选择显卡：勾选后这里会显示算力柱状图。')); $('#chart-sub').textContent=''; $('#chart-hint').textContent=''; $('#axis-mid').textContent=''; $('#axis-max').textContent=''; return; }

  const items = ms.map(m=> ({ m, v: valueFor(m, key) }))
                  .filter(x=> x.v !== null)
                  .sort((a,b)=> b.v - a.v);
  const missing = ms.length - items.length;
  const max = items.length ? items[0].v : 0;

  $('#chart-sub').textContent = meta.label + ' · ' + densityLabel;
  $('#chart-hint').textContent = '口径：' + densityLabel + '峰值理论算力，单位 ' + unit +
    (state.density === 'dense' && key.indexOf('int8') < 0 ? '' : '') +
    '。数值来自 NVIDIA 官方页/数据表，或由其公布的每 SM 每时钟吞吐量推导（详见下方口径说明）。' +
    (missing ? ' ' + missing + ' 款在该精度下不适用，已隐藏。' : '');
  $('#axis-max').textContent = fmt(max, 0) + ' ' + unit;
  $('#axis-mid').textContent = fmt(max/2, 0) + ' ' + unit;

  if (!items.length){ box.appendChild(el('div','empty','所选显卡均不支持该精度的 Tensor 算力')); return; }

  const powerKey = 'max_power_w';
  items.forEach(x=>{
    const row = el('div','bar-row');
    const nm = el('div','nm');
    nm.appendChild(document.createTextNode(x.m.name));
    nm.appendChild(el('i', null, '  ' + (x.m.tag || x.m.architecture || '')));
    row.appendChild(nm);
    const track = el('div','bar-track');
    const fill = el('div','bar-fill ' + (CAT_CLASS[x.m.category] || ''));
    fill.style.width = Math.max(1.2, (x.v / max) * 100) + '%';
    track.appendChild(fill); row.appendChild(track);
    const p = num(x.m[powerKey]);
    const val = el('div','bar-val', fmt(x.v, 0) + ' ' + unit);
    if (p) val.appendChild(el('em', null, '≈ ' + (x.v / p).toFixed(2) + ' ' + unit + '/W'));
    row.appendChild(val);
    row.title = x.m.name + '：' + fmt(x.v, 1) + ' ' + unit + (p ? ' @ ' + p + 'W' : '');
    box.appendChild(row);
  });
}

/* ============================================================
   主要指标速览（最多 4 张）
   ============================================================ */
function renderMini(){
  const box = $('#mini'); box.innerHTML = '';
  const ms = selectedModels().slice(0,4);
  if (!ms.length){ box.appendChild(el('div','empty','尚未选择显卡：勾选后这里会显示核心数、算力、显存与能效等关键指标。')); return; }
  const key = effectivePrecision();
  const meta = precisionMeta();
  const rows = [
    { label:'CUDA 核心', get:m=> num(m.cuda_cores), unit:'', mode:'max', fmt:v=>v.toLocaleString('en-US') },
    { label:'Tensor 核心', get:m=> num(m.tensor_cores), unit:'', mode:'max', fmt:v=>v.toLocaleString('en-US') },
    { label:'加速频率', get:m=> num(m.boost_clock_mhz), unit:'MHz', mode:'max', fmt:v=>v.toFixed(0) },
    { label:'FP32 峰值', get:m=> num(m.fp32_tflops_dense), unit:'TFLOPS', mode:'max', fmt:v=>v.toFixed(1) },
    { label: meta.label + ' 算力', get:m=> valueFor(m,key), unit: meta.unit, mode:'max', fmt:v=>v.toFixed(0) },
    { label:'显存容量', get:m=> num(m.memory_size_gb), unit:'GB', mode:'max', fmt:v=>v.toFixed(0) },
    { label:'显存带宽', get:m=> num(m.memory_bandwidth_gbs), unit:'GB/s', mode:'max', fmt:v=>v.toFixed(0) },
    { label:'最大功耗', get:m=> num(m.max_power_w), unit:'W', mode:'min', fmt:v=>v.toFixed(0) },
    { label: meta.unit + '/W 能效', get:m=>{ const a=valueFor(m,key), p=num(m.max_power_w); return a&&p? a/p : null; },
      unit: meta.unit+'/W', mode:'max', fmt:v=>v.toFixed(2) },
    { label:'发布日期', get:m=> m.release_date, unit:'', mode:'plain', fmt:v=>String(v) }
  ];
  ms.forEach(m=>{
    const card = el('div','mini-card');
    card.appendChild(el('h3', null, m.name));
    card.appendChild(el('div','arch', (m.architecture||'') + (m.codename? ' · '+m.codename : '') + (m.process? ' · '+m.process : '')));
    const kvs = el('div','kvs');
    rows.forEach(r=>{
      const v = r.get(m);
      const vals = ms.map(x=> r.get(x)).filter(x=> typeof x === 'number' && isFinite(x));
      const hasComp = vals.length > 1 && r.mode !== 'plain';
      const best = hasComp ? (r.mode==='max' ? Math.max(...vals) : Math.min(...vals)) : null;
      const kv = el('div','kv');
      kv.appendChild(el('span', null, r.label));
      const b = el('b', null, (v==null || v==='') ? '—' : (typeof v === 'number' ? r.fmt(v) + (r.unit?(' '+r.unit):'') : String(v)));
      if (best !== null && v === best) b.className = 'win';
      kv.appendChild(b); kvs.appendChild(kv);
    });
    card.appendChild(kvs);
    box.appendChild(card);
  });
}

/* ============================================================
   来源与口径
   ============================================================ */
function renderSources(){
  const ul = $('#srclist'); ul.innerHTML = '';
  const seen = new Set();
  (state.data.sources || []).forEach(s=>{
    if (seen.has(s.url)) return; seen.add(s.url);
    const li = el('li');
    const a = el('a', null, s.title || s.url); a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
    li.appendChild(a);
    const use = s.use || s.precision || '';
    if (use) li.appendChild(el('span','sub', ' — ' + use));
    ul.appendChild(li);
  });
  const c = $('#caliber');
  c.innerHTML = '';
  (state.data.caliber || []).forEach(line=> c.appendChild(el('p', null, line)));
  c.appendChild(el('p','sub', '数据快照生成时间：' + (state.data.generated || '—') + '（页面内保存的是抓取当时的官方口径，厂商可能随时改版）。'));
}

/* ============================================================
   CSV 导出
   ============================================================ */
function exportCSV(){
  const ms = selectedModels();
  if (!ms.length){ toast('请先选择要导出的显卡'); return; }
  const cols = [
    ['名称','name'],['类别','category'],['架构','architecture'],['代号','codename'],['制程','process'],['发布','release_date'],
    ['SM','sm_count'],['CUDA','cuda_cores'],['Tensor','tensor_cores'],['RT','rt_cores'],
    ['基础频率 MHz','base_clock_mhz'],['加速频率 MHz','boost_clock_mhz'],
    ['FP32 TFLOPS','fp32_tflops_dense'],['FP64 TFLOPS','fp64_tflops_dense'],['FP64 Tensor TFLOPS','fp64_tensor_tflops'],
    ['FP4 稠密 TFLOPS','tensor_dense_tflops.fp4'],['FP6 稠密 TFLOPS','tensor_dense_tflops.fp6'],
    ['FP8 稠密 TFLOPS','tensor_dense_tflops.fp8'],['FP16 稠密 TFLOPS','tensor_dense_tflops.fp16'],
    ['BF16 稠密 TFLOPS','tensor_dense_tflops.bf16'],['TF32 稠密 TFLOPS','tensor_dense_tflops.tf32'],
    ['INT8 稠密 TOPS','tensor_dense_tflops.int8'],
    ['FP4 稀疏 TFLOPS','tensor_sparse_tflops.fp4'],['FP8 稀疏 TFLOPS','tensor_sparse_tflops.fp8'],
    ['FP16 稀疏 TFLOPS','tensor_sparse_tflops.fp16'],['BF16 稀疏 TFLOPS','tensor_sparse_tflops.bf16'],
    ['TF32 稀疏 TFLOPS','tensor_sparse_tflops.tf32'],['INT8 稀疏 TOPS','tensor_sparse_tflops.int8'],
    ['官方 AI TOPS','ai_tops_official'],['AI TOPS 精度','ai_tops_precision'],
    ['显存 GB','memory_size_gb'],['显存类型','memory_type'],['位宽 bit','memory_bus_width_bit'],
    ['带宽 GB/s','memory_bandwidth_gbs'],['最大功耗 W','max_power_w'],['建议电源 W','recommended_psu_w'],
    ['供电接口','power_connector'],['槽位','slot_width'],['长度 mm','length_mm'],['接口','interface'],
    ['NVLink','nvlink'],['显示输出','display_outputs'],['备注','notes']
  ];
  const esc = v => { const s = v==null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const lines = [cols.map(c=>esc(c[0])).join(',')];
  ms.forEach(m=> lines.push(cols.map(c=>{
    const v = dig(m, c[1]);
    if (typeof v === 'boolean') return esc(v ? '是' : '否');
    if (Array.isArray(v)) return esc(v.join(' / '));
    return esc(v);
  }).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nvidia-gpu-compare-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast('已导出 ' + ms.length + ' 款显卡的 CSV');
}
</script>
